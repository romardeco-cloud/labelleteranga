databases:
  - name: labelleteranga-db
    plan: free
    databaseName: labelleteranga
    user: labelleteranga

services:
  - type: web
    name: labelleteranga-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "api.labelleteranga.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://labelleteranga.com,https://www.labelleteranga.com"
      - key: FRONTEND_URL
        value: "https://labelleteranga.com"
      - key: DATABASE_URL
        fromDatabase:
          name: labelleteranga-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: "xof"
