name: Backend tests

# Fait tourner automatiquement les tests Django (backend/apps/reports/tests.py) sur chaque push et chaque
# pull request : c'est ce qui garantit dans la duree que la regle du "jour commercial" (periode de grace de
# 2h30 - voir apps.pos.services.GRACE_CUTOFF) reste correcte dans tous les rapports, sans avoir a la
# reverifier manuellement a chaque changement de code.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labelleteranga
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/labelleteranga
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python manage.py test
